[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ros-mcp-server"
version = "0.1.0"
description = "MCP server exposing a stable semantic robotics API over an unmodified ROS 2 graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    # Approved 2026-09-15 for robot.get_camera_image's JPEG thumbnail re-encoding
    # (docs/09-perception-architecture.md Binary Data Policy, ADR-009) — no combination
    # of the other approved dependencies can encode/resize an image.
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
